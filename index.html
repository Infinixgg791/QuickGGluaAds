<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявления - Lua GameGuardian</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Объявления Lua GameGuardian</h1>
            <div class="header-icons">
                <i class="fas fa-user-circle icon" id="accountIcon"></i>
                <button id="addAdButton">Добавить объявление</button>
            </div>
        </div>
    </header>
    <main class="container">
        <div id="adsContainer"></div>
    </main>

    <div id="adFormModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <form id="adForm">
                <h2>Добавить объявление</h2>
                <input type="text" id="title" placeholder="Название" required>
                <textarea id="description" placeholder="Описание" required></textarea>
                <input type="file" id="image" accept="image/*" required>
                <button type="submit">Добавить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
