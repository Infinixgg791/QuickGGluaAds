<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявления - Lua GameGuardian</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Объявления Lua GameGuardian</h1>
        <div class="header-icons">
            <img src="account-icon.png" alt="Аккаунт" class="icon" id="accountIcon">
            <button id="addAdButton">+</button>
        </div>
    </header>
    <main>
        <div id="adsContainer"></div>
    </main>

    <div id="adFormModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <form id="adForm">
                <input type="text" id="title" placeholder="Название" required>
                <textarea id="description" placeholder="Описание" required></textarea>
                <input type="file" id="image" accept="image/*" required>
                <button type="submit">Добавить объявление</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
